[project]
name = "aio-cctv"
version = "0.8.0"
requires-python = ">=3.10,<3.13"
dependencies = [
  "ultralytics>=8.3",        
  "supervision>=0.25",       
  "opencv-python>=4.10",
  "numpy",
  "pydantic>=2.7",           
  "yt-dlp",                  
  "lap>=0.5.12",             # dibutuhkan BoT-SORT/ByteTrack Ultralytics (Fase 3)
  "pyyaml",                  # module.yaml (Fase 6)
  "packaging",               # cek requirements modul (Fase 6)
]

[project.optional-dependencies]
gui   = ["PyQt6>=6.7", "pyqtgraph>=0.13", "keyring", "keyrings.alt", "platformdirs",
         "shapely>=2.0",   # shapely: validasi poligon editor zona (Fase 5 §5.6)
         "psutil", "nvidia-ml-py"]   # pemakaian CPU/RAM/GPU -> system_minute (Fase 7)
web   = ["fastapi>=0.110", "uvicorn>=0.29"]   # dashboard web lokal (Fase 8 §8)
rtsp  = ["av>=12", "onvif-zeep", "WSDiscovery"]                        
eval  = ["motmetrics", "pandas", "matplotlib"]                         
dev   = ["pytest", "ruff", "httpx"]           # httpx: TestClient FastAPI

[tool.ruff]
line-length = 100

[tool.setuptools.packages.find]
include = ["aio_cctv*"]
[tool.setuptools.package-data]
# berkas non-Python yang dibaca saat runtime (skema DB, halaman web, ikon tema)
aio_cctv = ["storage/schema.sql", "web/static/*", "gui/assets/*.svg"]
