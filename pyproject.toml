[project]
name = "aio-cctv"
version = "0.0.1"
requires-python = ">=3.10,<3.13"
dependencies = [
  "ultralytics>=8.3",        
  "supervision>=0.25",       
  "opencv-python>=4.10",
  "numpy",
  "pydantic>=2.7",           
  "yt-dlp",                  
]

[project.optional-dependencies]
gui   = ["PyQt6>=6.7", "pyqtgraph>=0.13", "keyring", "platformdirs"]   
rtsp  = ["av>=12", "onvif-zeep", "WSDiscovery"]                        
eval  = ["motmetrics", "pandas", "matplotlib"]                         
dev   = ["pytest", "ruff"]

[tool.ruff]
line-length = 100

[tool.setuptools]
packages = ["aio_cctv"]