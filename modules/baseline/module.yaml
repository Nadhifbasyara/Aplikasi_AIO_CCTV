# Modul baseline — kode Fase 2–3 yang dibungkus kontrak v1 (Fase 6 §5.5).
# Alat uji & contoh, bukan kontribusi analitik TA. Lihat docs/kontrak-modul.md.
id: baseline
name: Baseline (ByteTrack + dwell/garis/heatmap)
version: 1.0.0
api_version: "1.0"
authors: ["Nadhif Basyara"]
license: "AGPL-3.0"
entrypoint: analyzer:BaselineModule

model:
  weights: ../../models/yolo11n.pt    # COCO pretrained; folder models/ tidak ikut git
  task: detect
  imgsz: 640
  conf: 0.35
  iou: 0.5
  classes: [person]

requirements:
  - supervision>=0.25

regions:                               # baseline memperlakukan semua zona & garis sama;
                                       # peran di sini hanya label untuk preset & aturan alert
  - {role: area,  kind: zone, label: "Area pantau", hint: "Lantai area yang ingin dihitung", multiple: true}
  - {role: pintu, kind: line, label: "Pintu / jalur", hint: "Garis melintang jalur; arah panah = masuk"}

params:
  grace_s:            {type: float, default: 1.5, min: 0,   max: 30,  label: "Grace period dwell (detik)"}
  min_dwell_s:        {type: float, default: 1.0, min: 0,              label: "Dwell minimum (detik)"}
  line_min_cross_s:   {type: float, default: 0.5, min: 0,   max: 5,   label: "Waktu minimum lintas garis (detik)"}
  lost_track_seconds: {type: float, default: 2.0, min: 0.1, max: 30,  label: "Simpan track hilang (detik)"}
  track_activation:   {type: float, default: 0.25, min: 0,  max: 1,   label: "Ambang aktivasi track"}
  track_matching:     {type: float, default: 0.8, min: 0,  max: 1,    label: "Ambang pencocokan track"}

metrics:
  - {key: people_count, label: "Orang terlacak", unit: "orang", agg: avg}
  - {key: zone_count,   label: "Orang",          unit: "",      per_region: true, agg: avg}
  - {key: line_in,      label: "Masuk",          unit: "",      per_region: true, agg: last}
  - {key: line_out,     label: "Keluar",         unit: "",      per_region: true, agg: last}

events:
  - {type: dwell_closed, label: "Sesi dwell selesai", fields: {start: float, end: float, duration_s: float}}
  - {type: line_cross,   label: "Melintas garis",     fields: {direction: str}}

dashboard:
  - {type: kpi,        metric: people_count}
  - {type: timeseries, metric: zone_count, title: "Jumlah orang per zona"}
  - {type: hourly,     event: line_cross,  title: "Lintasan per jam"}
  - {type: heatmap}
